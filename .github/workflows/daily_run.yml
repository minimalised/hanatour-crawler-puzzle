name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gspread google-auth playwright playwright-stealth
          python -m playwright install chromium

      # 깃허브 저장소에 함께 올라간 secrets.json 파일을 크롤러들이 그대로 읽어서 실행합니다.
      - name: Run Existing Crawling
        run: |
          python -u crawling.py
          python -u crawling_cruise.py
          python -u crawling_detail.py
          python -u crawling_hotel.py
          python -u crawling_local.py
