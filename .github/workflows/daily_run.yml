name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth playwright playwright-stealth
          playwright install chromium
          playwright install-deps


      - name: Run Cruise Crawler
        run: python -u crawling_cruise.py
