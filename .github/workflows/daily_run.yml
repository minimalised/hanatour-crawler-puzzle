name: Daily Hanatour Crawling

on:
  schedule:
    # UTC 23:00은 한국 시간(KST) 다음날 오전 8시입니다.
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    # 경고를 없애기 위해 Node.js 24 환경 강제 설정
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas gspread google-auth playwright playwright-stealth
        playwright install chromium
        playwright install-deps

    # 💡 팁: secrets.json 파일을 생성하는 단계가 빠져있다면 추가해야 합니다.
    # 만약 기존에 잘 돌아갔다면 이 부분은 본인의 설정에 맞춰 유지하세요.
    - name: Create secrets.json from GitHub Secrets
      run: echo "${{ secrets.GCP_SERVICES_JSON }}" > secrets.json

    - name: Run Crawler
      run: python -u crawling.py
