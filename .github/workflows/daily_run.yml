name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth playwright playwright-stealth
          playwright install chromium
          playwright install-deps

      - name: Run Crawler
        run: python -u crawling.py

      - name: Run Cruise Crawler
        run: python -u crawling_cruise.py
