name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gspread google-auth playwright playwright-stealth
          python -m playwright install chromium
      
      # [핵심] 가상 컴퓨터가 켜지면 GitHub Secret(HANA_SECRET)을 읽어서 완벽한 'secrets.json' 파일을 만들어냅니다.
      - name: Create secrets.json from GitHub Secret
        run: |
          cat << 'EOF' > secrets.json
          ${{ secrets.HANA_SECRET }}
          EOF

      # 이제 파이썬 코드들이 평소처럼 프로젝트 폴더 안의 'secrets.json'을 정상적으로 찾아서 읽게 됩니다!
      - name: Run Existing Crawling
        run: |
          python -u crawling.py
          python -u crawling_cruise.py
          python -u crawling_detail.py
          python -u crawling_hotel.py
          python -u crawling_local.py
