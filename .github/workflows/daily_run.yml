name: Daily Hanatour Crawling

on:
  schedule:
    # UTC 00:00은 한국 시간 오전 9시입니다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 우리가 원할 때 수동으로 '실행' 버튼을 누르기 위해 추가합니다.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas gspread google-auth playwright playwright-stealth
        playwright install chromium

    - name: Run Crawler
      run: python crawling_ydt.py # 실제 본인의 파이썬 파일명으로 적으세요!
