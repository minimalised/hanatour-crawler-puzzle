name: Daily Hanatour Crawling

on:
  schedule:
    # UTC 23:00은 한국 시간(KST) 다음날 오전 8시입니다.
    # 분 시 일 월 요일
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas gspread google-auth playwright playwright-stealth
        playwright install chromium

    - name: Run Crawler
      run: python crawling.py
