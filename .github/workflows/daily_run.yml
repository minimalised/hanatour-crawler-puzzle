name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gspread google-auth playwright playwright-stealth
          python -m playwright install chromium
      
      # [변경 포인트] 실행 시점에 GitHub Secret(HANA_SECRET)을 읽어와서 secrets.json 파일을 직접 생성합니다.
      - name: Create secrets.json from GitHub Secret
        run: |
          echo '${{ secrets.HANA_SECRET }}' > secrets.json

      - name: Run Existing Crawling
        # 파이썬 코드들이 로컬 모드처럼 secrets.json 파일을 직접 참조하므로 GOOGLE_JSON_RAW 환경 변수는 제외해도 됩니다.
        run: |
          python -u crawling.py
          python -u crawling_cruise.py
          python -u crawling_detail.py
          python -u crawling_hotel.py
          python -u crawling_local.py
