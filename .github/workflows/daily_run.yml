name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 23 * * *' # 매일 밤 11시 실행
  workflow_dispatch: # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # gspread, google-auth, playwright-stealth 필수 포함
          pip install pandas gspread google-auth playwright playwright-stealth
          playwright install chromium
          playwright install-deps

      - name: Run Existing Crawling
        run: python -u crawling.py

      - name: Run Existing Crawling Cruise
        run: python -u crawling_cruise.py

      - name: Run Existing Promotion Crawling
        run: python -u crawling_promotion.py

      - name: Run Existing Cruise Promotion Crawling
        run: python -u crawling_promotion_cruise.py

      - name: Run Hotel List Crawling
        run: python -u crawling_hotel.py
