name: Daily Hanatour Crawling

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-noble

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas gspread google-auth playwright playwright-stealth openai
          python -m playwright install chromium

      # 💡 4개의 Key(인증키 2개 + 시트 ID 2개)를 환경 변수로 완벽하게 주입합니다.
      - name: Run Hanatour New Crawler
        env:
          GOOGLE_JSON_RAW: ${{ secrets.GOOGLE_JSON_RAW }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 🌟 새로 추가된 구글 스프레드시트 ID 시크릿 연동
          SOURCE_SPREADSHEET_ID: ${{ secrets.SOURCE_SPREADSHEET_ID }}
          TARGET_SPREADSHEET_IDS: ${{ secrets.TARGET_SPREADSHEET_IDS }}
        run: |
          # 실행할 파이썬 파일명을 새로 만드신 파일명(예: crawl_run.py)에 맞게 수정해 주세요!
          python -u crawl_run.py
